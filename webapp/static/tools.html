<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="{{BASE}}"><title>工具编辑 · updream-AI 编辑</title><link rel="stylesheet" href="static/studio.css"><script type="module" src="static/tools.js"></script></head><body class="editor-page tools-page" data-project="{{PROJECT}}"><header id="app-header" class="app-header"></header>
<main class="tool-layout"><aside class="asset-column" id="asset-library"></aside><section class="tool-workbench"><div id="main-preview" class="main-preview"></div><section class="tool-results"><div class="section-heading"><h3>生成结果</h3><div><button id="compare-versions" class="button secondary" hidden>对比版本</button><span class="muted">先预览，再下载</span></div></div><div id="result-list" class="result-list"></div></section><section class="task-section"><div class="section-heading"><h3>任务记录</h3><span id="task-summary" class="muted"></span></div><div id="job-list"></div></section></section>
<aside class="settings-column"><div class="settings-heading"><span class="eyebrow">EDITING TOOLS</span><h2>选择这次要做的编辑</h2><span id="draft-status" class="draft-status">参数自动保存</span></div><details class="brief-details" id="demo-brief" hidden><summary>查看示例需求</summary><p id="prompt-text"></p><a id="brief-chat-link">交给 Agent 继续编辑 →</a></details><details class="editorial-details"><summary>批注、版本与章节</summary><div id="editorial-panel"></div></details>
<div id="tool-groups" class="tool-tabs tool-groups" aria-label="工具分类"></div>
<div class="tool-picker"><label class="field">当前工具<select id="tool-select" aria-label="当前工具"></select></label><p id="tool-description"></p></div>
<form id="tool-settings" class="tool-form"></form>
<div class="tool-submit"><p id="tool-input-hint"></p><p id="tool-error" class="inline-error" role="alert" hidden></p><button id="tool-run" type="submit" form="tool-settings" class="button primary wide">生成视频</button></div>
<div class="settings-footer"><button id="delete-project" class="button text danger">删除项目</button></div></aside></main><div id="toast" class="toast" role="status" hidden></div></body></html>
