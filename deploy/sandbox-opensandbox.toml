[server]
host = "127.0.0.1"
port = 28090
max_sandbox_timeout_seconds = 3600
max_sandboxes = 30
limit_concurrency = 128

[proxy]
resolve_internal = true

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:release-1.2.0"

[storage]
allowed_host_paths = ["/data2/wujing03/distributed-agent-sandbox-backend/.sandbox-cluster/opensandbox/volumes"]

[store]
type = "sqlite"
path = "/data2/wujing03/distributed-agent-sandbox-backend/.sandbox-cluster/opensandbox/state/opensandbox.db"

[docker]
metadata_store_path = "/data2/wujing03/distributed-agent-sandbox-backend/.sandbox-cluster/opensandbox/state/metadata"
network_mode = "sandbox-agent-net"
publish_host = "127.0.0.1"
port_range_min = 42000
port_range_max = 42200
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 256
apparmor_profile = ""
seccomp_profile = ""

[secure_runtime]
type = "gvisor"
docker_runtime = "runsc"

[ingress]
mode = "direct"

[renew_intent]
enabled = false
