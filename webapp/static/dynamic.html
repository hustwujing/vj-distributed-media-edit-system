<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="{{BASE}}"><link rel="icon" href="data:,"><title>Agent 编辑 · 分布式 Agent</title><link rel="stylesheet" href="static/studio.css"><link rel="stylesheet" href="static/dynamic.css"><script type="module" src="static/dynamic.js"></script></head>
<body class="editor-page dynamic-page" data-project="{{PROJECT}}"><header id="app-header" class="app-header"></header>
<main class="dynamic-layout">
 <aside class="dynamic-sidebar"><div class="panel-heading"><div><span class="eyebrow">EXECUTION LEDGER</span><h2>执行流水</h2></div><span id="dynamic-ledger-status" role="status">等待任务</span></div><div id="dynamic-ledger" class="dynamic-ledger" aria-live="polite"></div><div class="sidebar-section-heading"><h2>运行记录</h2><span id="dynamic-run-count"></span></div><div id="dynamic-history" class="dynamic-history"></div></aside>
 <section class="dynamic-workspace"><div class="workspace-heading"><div><span class="eyebrow">AGENT CONVERSATION</span><h1 id="dynamic-workspace-title">任务对话</h1></div><span id="dynamic-connection" role="status">正在连接…</span></div>
  <section id="dynamic-run-tools"><div id="dynamic-conversation" class="dynamic-conversation"><div id="dynamic-input-history" class="dynamic-message-list"><div id="dynamic-user-messages"></div><article id="dynamic-agent-response" class="dynamic-message agent transcript" aria-live="polite" hidden><p id="dynamic-agent-text"></p><small id="dynamic-agent-text-status"></small></article><div id="dynamic-conversation-empty" class="conversation-empty"><strong>从一句要求开始</strong><span>Agent 的公开输出会在这里持续显示。</span></div></div><div id="dynamic-decisions"></div><div id="dynamic-diagnoses"></div></div><section id="dynamic-role-activity" class="dynamic-role-activity" hidden><header><strong>正在执行</strong><span id="dynamic-role-count"></span></header><div id="dynamic-role-items" class="dynamic-role-items" aria-live="polite"></div></section>
   <form id="dynamic-input-form" class="dynamic-composer" data-run="new"><textarea id="dynamic-input-content" required maxlength="8000" rows="3" aria-label="任务消息" placeholder="描述你要完成的任务…"></textarea><div id="dynamic-attachment-chips" class="dynamic-attachment-chips" hidden></div>
    <details id="dynamic-execution-settings" class="composer-settings"><summary>执行设置</summary><div class="delivery-target-field"><span>交付内容</span><div class="delivery-target-options"><label><input type="checkbox" name="delivery-target" value="成片 MP4" checked>成片 MP4</label><label><input type="checkbox" name="delivery-target" value="字幕 SRT">字幕 SRT</label><label><input type="checkbox" name="delivery-target" value="封面 PNG">封面 PNG</label><label><input type="checkbox" name="delivery-target" value="音频 WAV">音频 WAV</label><label><input type="checkbox" name="delivery-target" value="报告 JSON">报告 JSON</label><label><input type="checkbox" name="delivery-target" value="打包文件 ZIP">打包文件 ZIP</label></div><input id="dynamic-targets-other" maxlength="500" placeholder="其他交付内容，用逗号分隔"></div><div class="dynamic-model-settings"><label class="field">Harness / 模型<select id="dynamic-model-profile" required aria-label="沙盒 Harness 和模型" disabled><option value="">正在加载模型…</option></select></label><label class="field">推理强度<select id="dynamic-reasoning-effort" required aria-label="沙盒推理强度" disabled></select></label></div><p class="form-hint" id="dynamic-model-hint"></p><details id="dynamic-scope" class="inspector-details"><summary>授权与运行上限</summary><div id="dynamic-provider-limits"></div><label class="field">模型 Token 上限<input id="dynamic-token-budget" type="number" min="1024" max="4000000" value="4000000"></label><label class="field">最长时间（分钟）<input id="dynamic-time" type="number" min="1" max="1440" value="1440"></label><p id="dynamic-summary" class="form-hint">已配置的外部能力默认每项 10 次；设为 0 表示禁止调用，扩大范围时会等待确认。</p></details></details>
    <details id="dynamic-context-settings" class="composer-settings" hidden><summary>关联步骤与资料</summary><label class="field" id="dynamic-input-target-field">限定步骤<select id="dynamic-input-targets" multiple aria-label="限定修改步骤"></select></label><label class="field">已关联资料<select id="dynamic-input-assets" multiple aria-label="补充要求关联素材与资料"></select></label></details>
    <div class="composer-actions"><label class="icon-button composer-attach" title="上传并关联资料" aria-label="上传并关联资料">＋<input id="dynamic-upload" type="file" accept="video/*,audio/*,image/*,.srt,.txt,.md,.json,.csv,.pdf,.docx,.xlsx,.pptx" multiple hidden></label><span id="dynamic-upload-label">添加资料</span><span id="dynamic-input-status" role="status"></span><button id="dynamic-input-submit" class="button primary composer-send" type="submit">开始执行</button></div><p id="dynamic-error" role="alert" hidden></p>
   </form><div id="dynamic-control-jobs" hidden></div>
  </section><div id="dynamic-tasks" hidden></div><div id="dynamic-events" hidden></div>
 </section>
 <aside class="dynamic-inspector"><div class="inspector-heading"><span class="eyebrow">ARTIFACT PREVIEW</span><h2>作品与中间文件</h2></div><div id="dynamic-preview" class="main-preview dynamic-preview"></div>
  <section id="dynamic-current" hidden><div class="dynamic-statusbar"><div><span class="run-kicker">CURRENT RUN</span><h2 id="dynamic-title"></h2><span id="dynamic-status"></span><small id="dynamic-updated"></small><p class="muted" id="dynamic-model-current"></p></div><div class="run-actions"><a id="dynamic-diagnostics" class="icon-button" href="#" download title="下载诊断" aria-label="下载诊断">↓</a><button data-control="pause" class="icon-button" title="暂停" aria-label="暂停">Ⅱ</button><button data-control="resume" class="icon-button" title="继续" aria-label="继续">▶</button><button data-control="cancel" class="icon-button danger-icon" title="取消" aria-label="取消">×</button></div></div><section id="dynamic-delivery"></section></section>
  <section id="dynamic-empty" class="workspace-empty"><strong>作品会显示在这里</strong><span>候选、中间文件和正式交付会集中预览。</span></section>
 </aside>
</main>
<button id="dag-fab" class="dag-fab" hidden title="打开运行图" aria-label="打开运行图"><span class="dag-fab-core"></span><span id="dag-fab-count" class="dag-fab-count"></span></button>
<dialog id="dag-dialog" class="dag-dialog"><header><div><span class="eyebrow">LIVE EXECUTION GRAPH</span><h2>运行图</h2></div><div class="dag-legend"><span><i class="succeeded"></i>完成</span><span><i class="active"></i>执行中</span><span><i class="waiting"></i>等待</span><span><i class="failed"></i>受阻</span></div><button id="dag-close" class="icon-button" aria-label="关闭运行图">×</button></header><div class="dag-body"><div id="dag-viewport" class="dag-viewport"><div id="dag-canvas" class="dag-canvas"></div></div><aside id="dag-detail" class="dag-detail"><div class="dag-detail-empty"><strong>节点详情</strong><span>悬停或点击节点查看</span></div></aside></div></dialog>
<div id="toast" role="status" class="toast" hidden></div></body></html>
