<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="{{BASE}}"><title>聊天编辑 · updream-AI 编辑</title><link rel="stylesheet" href="static/studio.css"><link rel="stylesheet" href="static/image_compare.css"><script type="module" src="static/chat.js"></script></head><body class="editor-page chat-page" data-project="{{PROJECT}}"><header id="app-header" class="app-header"></header>
<main class="chat-layout"><aside class="asset-column chat-assets"><button class="button subtle drawer-close" id="close-assets">收起素材 ×</button><div id="asset-library"></div><div class="project-actions"><a id="open-tools" class="button secondary wide">切换到工具编辑</a><button id="delete-project" class="button text danger wide">删除项目</button></div></aside>
<section class="conversation-panel"><div class="conversation-header"><div><h2>和 Agent 一起剪辑</h2><span id="agent-status" class="connection-status">正在连接…</span></div><div class="conversation-actions"><button id="latest-delivery" type="button" class="button subtle latest-delivery" hidden></button><button id="project-versions" type="button" class="button subtle">项目版本</button><button id="show-assets" class="icon-button" title="素材库">▤</button><button id="show-preview" class="icon-button" title="预览作品">▧</button></div></div><div id="conversation-scroll" class="conversation-scroll"><div id="agent-messages" aria-live="polite"></div><button id="scroll-latest" class="scroll-latest" hidden>↓ 回到最新消息</button></div>
<div class="composer-wrap"><details id="agent-profile-panel" class="agent-profile-panel"></details><div id="canvas-context" class="canvas-context" hidden></div><div id="agent-confirmation" class="approval-card" hidden><div><span>已有方案通过检查</span><small>可以继续调整方案，也可以点击按钮或用自然语言确认执行</small></div><button id="agent-execute" class="button primary">确认并执行 ↗</button></div><p id="control-feedback" role="status" aria-live="polite" hidden></p><div id="live-status" class="live-status" hidden></div><form id="agent-form" class="composer"><div id="composer-attachments" class="composer-attachments"></div><label class="sr-only" for="agent-input">描述剪辑需求</label><textarea id="agent-input" rows="3" maxlength="8000" placeholder="描述你想要的画面、节奏或风格…"></textarea><div class="composer-toolbar"><div><button type="button" id="attach-files" class="icon-button" title="上传并附加素材">＋</button><span class="composer-mode">✦ 先讨论方案</span></div><div><span class="shortcut-hint">Ctrl / ⌘ + Enter</span><button type="button" id="agent-progress" class="button subtle">查进度</button><button type="button" id="agent-stop" class="button stop-button" hidden>停止</button><button type="submit" id="agent-send" class="send-button" aria-label="发送需求">↑</button></div></div></form><p class="composer-footnote">Agent 可以编写脚本并检查结果 · 原始素材保持只读</p></div></section>
<aside class="chat-preview"><div class="preview-pane-heading"><h3>作品与素材</h3><button id="close-preview" class="icon-button drawer-close" aria-label="返回对话">×</button></div><div id="main-preview" class="main-preview"></div><div class="preview-library"><div class="preview-library-tabs"><button class="selected" data-library="results">生成结果 <span id="result-count">0</span></button><button data-library="sources">原始素材</button></div><div id="result-list" class="result-list"></div><div id="source-previews" class="source-previews" hidden></div></div></aside></main><div id="toast" class="toast" role="status" hidden></div></body></html>
