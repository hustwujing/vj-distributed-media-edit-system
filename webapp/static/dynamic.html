<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="{{BASE}}"><link rel="icon" href="data:,"><title>动态工作流 · 分布式 Agent</title><link rel="stylesheet" href="static/studio.css"><link rel="stylesheet" href="static/dynamic.css"><script type="module" src="static/dynamic.js"></script></head>
<body data-project="{{PROJECT}}"><header id="app-header" class="app-header"></header><main class="dynamic-layout">
<aside class="dynamic-sidebar"><h2>项目素材</h2><p class="muted">仅使用你选中的素材。</p><div id="dynamic-assets"></div><label class="button secondary">上传素材<input id="dynamic-upload" type="file" multiple hidden></label><h2>工作流记录</h2><div id="dynamic-history"></div></aside>
<section class="dynamic-main"><div class="dynamic-heading"><div><div class="eyebrow">DYNAMIC WORKFLOW</div><h1>描述目标，逐步完成。</h1><p class="muted">根据实际结果继续规划，每一步都有明确的执行与验收记录。</p></div><span id="dynamic-connection" role="status">正在连接…</span></div>
<form id="dynamic-start"><label class="field">你希望完成什么<textarea id="dynamic-goal" required maxlength="8000" rows="4" placeholder="例如：分析这段视频，再剪成节奏紧凑的 30 秒预告片。"></textarea></label><label class="field">最终交付<input id="dynamic-targets" required maxlength="1000" placeholder="例如：30 秒预告片、中文字幕（用换行或逗号分隔）"></label>
<div class="dynamic-model-settings"><label class="field">沙盒 Harness / 模型<select id="dynamic-model-profile" required aria-label="沙盒 Harness 和模型" disabled><option value="">正在加载模型…</option></select></label><label class="field">沙盒推理强度<select id="dynamic-reasoning-effort" required aria-label="沙盒推理强度" disabled></select></label></div><p class="muted" id="dynamic-model-hint">沙盒 Implementer 使用本次选择；Manager、审查和诊断模型由系统配置并随本轮冻结。</p>
<details id="dynamic-scope"><summary>确认执行范围与调用上限</summary><p>默认允许本地分析、剪辑及专业 Agent 协作。外部转写、图片和视频生成需要单独授权。</p><div id="dynamic-provider-limits"></div><label class="field">模型 Token 上限<input id="dynamic-token-budget" type="number" min="1024" max="2000000" value="200000"></label><label class="field">任务最长时间（分钟）<input id="dynamic-time" type="number" min="1" max="1440" value="120"></label></details>
<p id="dynamic-summary">外部付费调用默认不授权；超出执行范围时会暂停，等待你确认。</p><button id="dynamic-submit" class="button primary" type="submit">确认范围并开始</button><p id="dynamic-error" role="alert" hidden></p></form>
<section id="dynamic-current" hidden><div class="dynamic-statusbar"><div><h2 id="dynamic-title"></h2><span id="dynamic-status"></span><small id="dynamic-updated"></small><p class="muted" id="dynamic-model-current"></p></div><div><a id="dynamic-diagnostics" class="button subtle" href="#" download>下载诊断</a><button data-control="pause" class="button secondary">暂停</button><button data-control="resume" class="button secondary">继续</button><button data-control="cancel" class="button subtle">取消</button></div></div><form id="dynamic-input-form"><label class="field">补充要求<textarea id="dynamic-input-content" maxlength="8000" rows="3" placeholder="补充修改意见或后续要求"></textarea></label><label class="field">限定修改步骤（不选表示整轮）<select id="dynamic-input-targets" multiple aria-label="限定修改步骤"></select></label><label class="field">关联素材（可先在左侧上传）<select id="dynamic-input-assets" multiple aria-label="补充要求关联素材"></select></label><button id="dynamic-input-submit" class="button primary" type="submit">提交补充要求</button><p id="dynamic-input-status" role="status"></p></form><div id="dynamic-input-history"></div><div id="dynamic-decisions"></div><div id="dynamic-control-jobs"></div><div id="dynamic-diagnoses"></div><div id="dynamic-tasks"></div><section id="dynamic-delivery"></section><details><summary>规划和状态记录</summary><div id="dynamic-events"></div></details></section>
</section></main><div id="toast" role="status" class="toast" hidden></div></body></html>
