<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="{{BASE}}"><title>图片工作台 · updream-AI 编辑</title><link rel="stylesheet" href="static/studio.css"><link rel="stylesheet" href="static/images.css"><link rel="stylesheet" href="static/image_compare.css"><script type="module" src="static/images.js"></script></head><body class="image-page" data-project="{{PROJECT}}"><header id="app-header" class="app-header"></header>
<main class="image-layout"><aside class="image-sidebar"><div class="image-section-title"><h2>素材与图层</h2><button class="button subtle" id="image-upload">＋ 上传图片</button><input id="image-files" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></div><div id="image-assets" class="image-assets"></div><div class="image-section-title"><h3>图层</h3><div><button class="icon-button" id="add-text" title="添加文字">T＋</button><button class="icon-button" id="add-rectangle" title="添加色块">▣＋</button><button class="icon-button" id="add-adjustment" title="添加调整图层">◐＋</button></div></div><p class="image-hint">上方图层覆盖下方，可拖动画布中的图层。</p><div id="layers"></div><button id="edit-selected-chat" class="button secondary wide">让 Agent 修改选中图层 →</button><p class="image-hint">锁定后，该图层的内容、位置和顺序受到保护。新增覆盖层仍会影响合成画面。</p><div class="layer-actions"><button id="layer-up" class="button subtle">上移</button><button id="layer-down" class="button subtle">下移</button><button id="layer-delete" class="button text danger">删除</button></div><div class="align-actions" aria-label="图层对齐"><button data-align="left" title="左对齐">左</button><button data-align="center" title="水平居中">中</button><button data-align="right" title="右对齐">右</button><button data-align="top" title="顶对齐">上</button><button data-align="middle" title="垂直居中">央</button><button data-align="bottom" title="底对齐">下</button><button id="distribute-x" title="所有可编辑图层水平等距">横距</button><button id="distribute-y" title="所有可编辑图层垂直等距">纵距</button></div><div class="image-section-title"><h3>保存的版本</h3><button class="button text" id="refresh-versions">刷新</button></div><div id="image-versions"></div></aside>
<section class="image-center"><div class="canvas-toolbar"><div class="canvas-modes" aria-label="画布操作"><button data-mode="move" class="selected">移动</button><button data-mode="box">框选</button><button data-mode="point">点选主体</button><button data-mode="brush">涂抹选区</button></div><div><button class="icon-button" id="undo" title="撤销">↶</button><button class="icon-button" id="redo" title="重做">↷</button><button class="button subtle" id="toggle-guides">参考线</button><button class="button subtle" id="clear-selection">清除选区</button></div></div><div class="canvas-options"><span id="canvas-info"></span><label>缩放 <select id="zoom"><option value="fit">适应画布</option><option value="0.5">50%</option><option value="1">100%</option><option value="2">200%</option></select></label><label id="brush-option" hidden>画笔 <input id="brush-size" type="range" min="5" max="150" value="35"></label><button id="toggle-selection-overlay" class="button text selected" hidden>隐藏选区</button><button id="compare-original" class="button text">原图 / 当前效果</button></div><div id="canvas-update" class="canvas-update" hidden><span>画布有新版本。</span><button id="reload-canvas" class="button secondary">载入最新版本</button></div><div id="canvas-stage"><div id="canvas-wrap"><canvas id="image-canvas"></canvas><canvas id="selection-canvas"></canvas></div><div id="canvas-empty">上传图片开始，或添加文字和色块创作。<small>原图保留，编辑生成独立版本。</small></div></div><div class="canvas-footer"><span id="document-status">画布未保存</span><button class="button primary" id="save-document">保存版本</button><select id="export-format" aria-label="导出格式"><option value="png">PNG</option><option value="jpg">JPG</option><option value="webp">WebP</option><option value="psd">PSD 分层</option><option value="ora">ORA 分层</option></select><button class="button secondary" id="export-document">生成导出文件</button></div><section class="image-results"><div class="image-section-title"><h3>生成结果</h3><span id="image-job-status"></span></div><button id="compare-candidates" class="button secondary wide" hidden>对比候选效果并应用到选中图层</button><div id="image-output"></div><details class="image-task-history"><summary>任务记录与日志</summary><div id="image-job-list"></div></details></section></section>
<aside class="image-inspector"><div class="inspector-tabs"><button data-inspector="properties" class="selected">图层属性</button><button data-inspector="ai">AI 编辑</button></div><div id="properties-panel"><section class="parameter-section"><h3>画布</h3><div class="field-grid"><label class="field">宽<input id="canvas-width" type="number" min="16" max="4096"></label><label class="field">高<input id="canvas-height" type="number" min="16" max="4096"></label></div><label class="checkbox-field"><input id="transparent" type="checkbox">透明背景</label><label class="field">背景颜色<input id="canvas-background" type="color" value="#ffffff"></label><button class="button subtle wide" id="apply-canvas">应用画布设置</button></section><div id="layer-properties"></div></div>
<div id="ai-panel" hidden><p class="image-hint">本地工具不调用新增模型；生成式工具继续使用已有服务。</p><label class="field">工具<select id="image-action"><option value="segment">点选 / 框选主体</option><option value="refine_mask">精修当前蒙版</option><option value="remove_bg">自动抠图</option><option value="local_adjust">白平衡、色阶与增强</option><option value="color_match">匹配参考图色彩</option><option value="perspective">四点透视 / 文档扫描</option><option value="product_layout">商品统一构图与投影</option><option value="batch_export">批量尺寸、水印与格式</option><option value="local_edit">选区重绘</option><option value="erase">消除选区内容</option><option value="ocr">识别图片文字</option><option value="replace_text">选区改字</option><option value="decompose">AI 图片分层</option><option value="generate">多参考图编辑 / 换背景</option></select></label><div id="action-settings"></div><p id="selection-info" class="image-hint"></p><div id="ocr-lines"></div><button id="run-image-action" class="button primary wide">开始处理</button><p id="image-error" class="inline-error" role="alert" hidden></p><div class="image-script-note"><strong>复杂需求，交给 Agent</strong><p>聊天可组合这些能力，也能编写 Python 脚本。先保存画布版本，再切换聊天继续。</p><a id="image-chat-link" class="button secondary wide">进入聊天编辑 →</a></div></div></aside></main><div id="toast" role="status" class="toast" hidden></div></body></html>
