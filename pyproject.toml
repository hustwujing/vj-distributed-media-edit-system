[project]
name = "vj-distributed-media-edit-system"
version = "0.1.0"
description = "Distributed, conversation-driven image, audio and video editing system"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
animations = ["manim"]
web = [
    "jsonschema>=4.23,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "websockets>=15,<16",
    "opensandbox>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "psd-tools>=1.10,<2",
    "opencv-python-headless>=4.10,<5",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
    "cryptography>=44,<51",
    "redis>=5,<7",
    "tiktoken==0.12.0",
    "networkx>=3.4.2,<3.8",
    "PyYAML==6.0.3",
    "sympy==1.14.0",
    "xmltodict==1.0.4",
    "av==16.0.1",
    "ffmpeg-python==0.2.0",
    "imageio==2.38.1",
    "imageio-ffmpeg==0.8.1",
    "scikit-image==0.26.0",
    "ImageHash==4.3.2",
    "piexif==1.1.3",
    "CairoSVG==2.9.1",
    "svgwrite==1.4.3",
    "rembg[cpu]==2.0.87",
    "onnxruntime==1.31.1",
    "mutagen==1.48.1",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "shapely==2.2.0",
    "trimesh==5.2.0",
    "reportlab==5.1.0",
    "PyMuPDF==2.1",
]
web-test = ["httpx>=0.28,<1", "moto[server]>=5,<6"]
harnesses = ["claude-agent-sdk==0.2.176", "deepseek-harness-sdk==0.2.1rc2"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["webapp*"]

[tool.setuptools.package-data]
webapp = ["static/**/*"]
