<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="{{BASE}}"><link rel="icon" href="data:,"><title>Agent 编辑 · 分布式 Agent</title><link rel="stylesheet" href="static/studio.css"><link rel="stylesheet" href="static/dynamic.css"><script type="module" src="static/dynamic.js"></script></head>
<body class="editor-page dynamic-page" data-project="{{PROJECT}}"><header id="app-header" class="app-header"></header>
<main class="dynamic-layout">
 <aside class="dynamic-sidebar"><div class="panel-heading"><div><span class="eyebrow">PROJECT MEDIA</span><h2>素材与资料</h2></div><label class="button subtle asset-upload-button" title="添加图片或文件"><span aria-hidden="true">＋</span><span id="dynamic-upload-label">添加文件</span><input id="dynamic-upload" type="file" accept="video/*,audio/*,image/*,.srt,.txt,.md,.json,.csv,.pdf,.docx,.xlsx,.pptx" multiple hidden></label></div><div id="dynamic-assets" class="dynamic-assets"></div><div class="sidebar-section-heading"><h2>运行记录</h2><span id="dynamic-run-count"></span></div><div id="dynamic-history" class="dynamic-history"></div></aside>
 <section class="dynamic-workspace"><div class="workspace-heading"><div><span class="eyebrow">AGENT WORKSPACE</span><h1>作品与执行</h1></div><span id="dynamic-connection" role="status">正在连接…</span></div><div id="dynamic-preview" class="main-preview dynamic-preview"></div>
  <section id="dynamic-current" hidden><div class="dynamic-statusbar"><div><span class="run-kicker">CURRENT RUN</span><h2 id="dynamic-title"></h2><span id="dynamic-status"></span><small id="dynamic-updated"></small><p class="muted" id="dynamic-model-current"></p></div><div class="run-actions"><a id="dynamic-diagnostics" class="icon-button" href="#" download title="下载诊断" aria-label="下载诊断">↓</a><button data-control="pause" class="icon-button" title="暂停" aria-label="暂停">Ⅱ</button><button data-control="resume" class="icon-button" title="继续" aria-label="继续">▶</button><button data-control="cancel" class="icon-button danger-icon" title="取消" aria-label="取消">×</button></div></div><section id="dynamic-delivery"></section></section>
  <section id="dynamic-empty" class="workspace-empty"><strong>选择素材开始预览</strong><span>候选和正式交付会集中显示在这里。</span></section>
  <div id="dynamic-tasks" hidden></div><div id="dynamic-events" hidden></div>
 </section>
 <aside class="dynamic-inspector"><div class="inspector-heading"><span class="eyebrow">AGENT WORKBENCH</span><h2 id="dynamic-inspector-title">编辑要求</h2></div>
  <form id="dynamic-start"><label class="field">目标<textarea id="dynamic-goal" required maxlength="8000" rows="5" placeholder="描述要完成的剪辑、生成或检查"></textarea></label><label class="field">交付内容<input id="dynamic-targets" required maxlength="1000" placeholder="成片、字幕、封面等"></label><div class="dynamic-model-settings"><label class="field">Harness / 模型<select id="dynamic-model-profile" required aria-label="沙盒 Harness 和模型" disabled><option value="">正在加载模型…</option></select></label><label class="field">推理强度<select id="dynamic-reasoning-effort" required aria-label="沙盒推理强度" disabled></select></label></div><p class="form-hint" id="dynamic-model-hint"></p><details id="dynamic-scope" class="inspector-details"><summary>授权与运行上限</summary><div id="dynamic-provider-limits"></div><label class="field">模型 Token 上限<input id="dynamic-token-budget" type="number" min="1024" max="4000000" value="200000"></label><label class="field">最长时间（分钟）<input id="dynamic-time" type="number" min="1" max="1440" value="120"></label></details><p id="dynamic-summary" class="form-hint">外部调用默认关闭，扩大范围时会等待确认。</p><button id="dynamic-submit" class="button primary wide" type="submit">开始执行</button><p id="dynamic-error" role="alert" hidden></p></form>
  <section id="dynamic-run-tools" hidden><div id="dynamic-conversation" class="dynamic-conversation"><div id="dynamic-input-history" class="dynamic-message-list" aria-live="polite"></div><div id="dynamic-decisions"></div><div id="dynamic-diagnoses"></div></div><form id="dynamic-input-form" class="dynamic-composer"><div class="section-heading"><h3>发送修改要求</h3><span id="dynamic-input-status" role="status"></span></div><textarea id="dynamic-input-content" maxlength="8000" rows="3" aria-label="消息" placeholder="继续描述修改意见或下一步要求"></textarea><details class="composer-options"><summary>关联步骤与资料</summary><label class="field">限定步骤<select id="dynamic-input-targets" multiple aria-label="限定修改步骤"></select></label><label class="field">关联素材与资料<select id="dynamic-input-assets" multiple aria-label="补充要求关联素材与资料"></select></label></details><button id="dynamic-input-submit" class="button primary composer-send" type="submit">发送</button></form><div id="dynamic-control-jobs" hidden></div></section>
 </aside>
</main>
<button id="dag-fab" class="dag-fab" hidden title="打开运行图" aria-label="打开运行图"><span class="dag-fab-core"></span><span id="dag-fab-count" class="dag-fab-count"></span></button>
<dialog id="dag-dialog" class="dag-dialog"><header><div><span class="eyebrow">LIVE EXECUTION GRAPH</span><h2>运行图</h2></div><div class="dag-legend"><span><i class="succeeded"></i>完成</span><span><i class="active"></i>执行中</span><span><i class="waiting"></i>等待</span><span><i class="failed"></i>受阻</span></div><button id="dag-close" class="icon-button" aria-label="关闭运行图">×</button></header><div class="dag-body"><div id="dag-viewport" class="dag-viewport"><div id="dag-canvas" class="dag-canvas"></div></div><aside id="dag-detail" class="dag-detail"><div class="dag-detail-empty"><strong>节点详情</strong><span>悬停或点击节点查看</span></div></aside></div></dialog>
<div id="toast" role="status" class="toast" hidden></div></body></html>
