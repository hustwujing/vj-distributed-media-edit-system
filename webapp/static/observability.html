<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>任务运行观测</title>
<style>body{font:16px system-ui;margin:32px;background:#101820;color:#e5edf4}input,button,select{font:inherit;padding:10px;margin:5px;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#192632;padding:20px}small{color:#a8c2cc}</style>
<h1>任务运行观测</h1><p>仅限运维。通过 SSH 转发访问，凭据只保留在当前页面内存。</p>
<input id="token" type="password" placeholder="运维访问凭据" autocomplete="off"><select id="view"><option value="snapshot">集群与资源</option><option value="api_capacity">API 容量与等待</option><option value="logs">任务与追踪</option><option value="providers">上游调用</option><option value="storage">存储与依赖</option><option value="alerts">告警</option><option value="health">观测健康</option></select>
<input id="task" placeholder="任务 ID（日志查询）"><button id="load">查询</button><button id="more" hidden>下一页</button><p><small>未知状态保持未知。告警通知渠道未配置时，仅在此处及命令行展示。</small></p><pre id="out">请选择视图并查询。</pre>
<script>
let cursor=0;async function load(more=false){if(!more)cursor=0;const view=document.querySelector('#view').value;let path=['providers','storage','api_capacity'].includes(view)?'snapshot':view;if(path==='logs')path+='?task_id='+encodeURIComponent(document.querySelector('#task').value)+'&after='+cursor;try{const r=await fetch('/'+path,{headers:{Authorization:'Bearer '+document.querySelector('#token').value}});const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#out').textContent=JSON.stringify(view==='providers'?d.views?.providers:view==='api_capacity'?(d.views?.api_capacity??{status:'unknown',detail:'尚未收到 API 容量快照，请检查采集状态。'}):view==='storage'?{dependencies:d.dependencies,disk_free_bytes:d.gauges?.disk_free_bytes}:d,null,2);cursor=d.next_after||0;document.querySelector('#more').hidden=!d.has_more;}catch(e){document.querySelector('#out').textContent=e.message;}}document.querySelector('#load').onclick=()=>load();document.querySelector('#more').onclick=()=>load(true);
</script></html>
